<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Art Day</title><style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif;background:light-dark(#f7f5f0,#1b1c1a);color:light-dark(#292f29,#edece5)}*{box-sizing:border-box}body{margin:0;padding:24px 32px 60px;max-width:1100px;margin:auto}header,nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}header{justify-content:space-between;border-bottom:1px solid #8884;padding-bottom:18px}header strong{font-family:Georgia,serif;font-size:24px}button{font:inherit;padding:10px 16px;border-radius:24px;border:1px solid #8885;background:transparent;color:inherit;cursor:pointer}button:hover{background:#8882}button:focus-visible,a:focus-visible{outline:3px solid #a98d53;outline-offset:3px}button[aria-pressed=true]{background:light-dark(#36513e,#bfd0ba);color:light-dark(#fff,#17201a);border-color:transparent}.eyebrow{margin-top:28px;font-size:12px;letter-spacing:.12em;opacity:.6}h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(26px,4vw,42px);margin:10px 0}h2{font-family:Georgia,serif;font-weight:400;font-size:24px}.caption,#status{font-size:13px;opacity:.7}#main img{display:block;max-height:65vh;width:100%;object-fit:contain;margin:24px 0;cursor:zoom-in}.rating{justify-content:center;padding:8px 0 22px}.rating span{font-size:13px;margin-right:8px}.story{max-width:720px;margin:auto}p{line-height:1.7}#error{color:light-dark(#a42922,#ffb3a8)}#favorites{display:flex;gap:10px;flex-wrap:wrap}#favorites p{opacity:.65}a{color:inherit}footer{margin-top:38px;padding-top:16px;border-top:1px solid #8884}body[aria-busy=true] .rating{opacity:.6;pointer-events:none}@media(max-width:600px){body{padding:16px}.rating{gap:8px}.rating span{width:100%;text-align:center}button{padding:9px 13px}}
[hidden]{display:none!important}header nav{margin:12px 0;width:100%}header nav button{border:0;color:#797b70;padding:14px 22px}header nav button[aria-pressed=true]{background:#e5e5da;color:#303a2e}#reload{margin-left:auto;font-size:12px}.feedback{border-top:1px solid #8884;border-bottom:1px solid #8884;margin:30px 0;padding:22px 0}.feedback h2{font-size:32px;margin:8px 0}.muted{opacity:.65}.rating{justify-content:flex-start;padding:12px 0}.rating button{border-radius:12px;font-size:36px;padding:4px 15px;color:#869475}.rating button.filled{background:#e2e8d4;color:#56703d;border-color:#a5ba88}.traits,.actions{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.actions a{display:inline-block;padding:14px 20px;border:1px solid #bcc6b5;border-radius:10px;text-decoration:none}.actions a:first-child{background:#3d543e;color:white}.rank-row{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #8883;padding:12px 0}.taste-group{max-width:700px;margin:30px 0}#favorites-panel,#taste-panel{padding-top:24px}@media(prefers-color-scheme:dark){header nav button[aria-pressed=true]{background:#3d493b;color:#eee}}
</style></head><body><header><strong>Art Day</strong><nav><button id="today">Today</button><button id="favorites-tab">Favorites</button><button id="taste-tab">My taste</button><button id="reload">Refresh view</button></nav></header><p id="status" role="status"></p><p id="error" role="alert"></p><main id="main"></main><section id="favorites-panel" hidden><h1 id="favorites-title">Favorites</h1><div id="favorites"></div></section><section id="taste-panel" hidden></section><script>/*APP*/</script></body></html>
