interface:
  display_name: "Datapoint Finder"
  short_description: "Find official Morningstar datapoint names"
  icon_small: "./assets/icon.png"
  icon_large: "./assets/icon.png"
  brand_color: "#E4572E"
  default_prompt: "Use $datapoint-finder to find the datapoint name for Sharpe ratio."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "morningstar"
      description: "Morningstar MCP server"
      transport: "streamable_http"
      url: "https://mcp.morningstar.com/mcp"
