interface:
  display_name: "Medalist Rating Analyzer"
  short_description: "Analyze Morningstar Medalist Ratings with live MCP data."
  icon_small: "./assets/icon.png"
  icon_large: "./assets/icon.png"
  brand_color: "#E4572E"
  default_prompt: "Analyze VFIAX Medalist Rating."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "morningstar"
      description: "Morningstar MCP server"
      transport: "streamable_http"
      url: "https://mcp.morningstar.com/mcp"
